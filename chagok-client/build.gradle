plugins {
    id 'application'
    id 'com.github.johnrengelman.shadow'
}

dependencies {
    implementation project(':chagok-common')
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jfree:jfreechart:1.5.4'
}

application {
    mainClass = 'com.chagok.client.ClientMain'
}

tasks.named('run') {
    workingDir = rootProject.projectDir
}

shadowJar {
    archiveBaseName.set('chagok-client')
    archiveClassifier.set('')
    archiveVersion.set('')
    mergeServiceFiles()
}
