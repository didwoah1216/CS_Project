plugins {
    id 'application'
    id 'com.github.johnrengelman.shadow'
}

dependencies {
    implementation project(':chagok-common')
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.mysql:mysql-connector-j:8.4.0'
    testImplementation project(':chagok-client')
}

application {
    mainClass = 'com.chagok.server.ServerMain'
}

tasks.named('run') {
    workingDir = rootProject.projectDir
}

shadowJar {
    archiveBaseName.set('chagok-server')
    archiveClassifier.set('')
    archiveVersion.set('')
    mergeServiceFiles()
}
